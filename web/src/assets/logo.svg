<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    MankTV Logo
    方向：播放箭头尖角朝右上（45° 对角）
    渐变：左上青色 → 中间蓝色 → 右下紫色 → 右下品红
    左侧：6 个像素方块
  -->
  <defs>
    <!-- 主体渐变（左上青 → 右下品红，45° 对角方向） -->
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"  stop-color="#00D9FF"/>
      <stop offset="30%" stop-color="#1791FF"/>
      <stop offset="65%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF4FC1"/>
    </linearGradient>
    <!-- 左上高光 -->
    <linearGradient id="shine" x1="0.1" y1="0.9" x2="0.55" y2="0.35" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <!-- 右下阴影（深色叠层） -->
    <linearGradient id="shade" x1="0.45" y1="0.45" x2="0.98" y2="0.98" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <!-- 像素方块渐变 -->
    <linearGradient id="pixel" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#1F54E0"/>
    </linearGradient>
  </defs>

  <!-- ===== 播放箭头主体（圆角三角形，尖角朝右上，45° 对角布局） ===== -->
  <!-- 使用 path 画三顶点圆角三角形：
       左下 (40, 210)、右下 (210, 210)、尖角 (125, 40)
       三端都用 cubic-bezier 做圆角 -->
  <path
    d="
      M 125 30
      C 137 30 147 38 157 55
      L 223 173
      C 235 195 230 212 210 218
      L 157 228
      C 145 230 106 230 95 228
      L 46 218
      C 25 212 21 195 33 173
      L 93 55
      C 103 38 113 30 125 30
      Z
    "
    fill="url(#body)"
  />
  <!-- 高光叠层 -->
  <path
    d="
      M 125 30
      C 137 30 147 38 157 55
      L 223 173
      C 235 195 230 212 210 218
      L 157 228
      C 145 230 106 230 95 228
      L 46 218
      C 25 212 21 195 33 173
      L 93 55
      C 103 38 113 30 125 30
      Z
    "
    fill="url(#shine)"
  />
  <!-- 阴影叠层 -->
  <path
    d="
      M 155 185
      C 175 200 197 210 215 215
      C 235 190 230 165 220 150
      L 175 200
      C 168 208 160 212 155 185 Z
    "
    fill="url(#shade)"
  />

  <!-- ===== 左侧像素方块（6 个，按参考图位置分布） ===== -->
  <!-- 最顶部小青色方块 -->
  <rect x="2"  y="74"  width="32" height="32" rx="6" fill="url(#pixel)"/>
  <!-- 中上部大方块 -->
  <rect x="22" y="112" width="46" height="46" rx="8" fill="url(#pixel)"/>
  <!-- 最左侧中方块 -->
  <rect x="0"  y="170" width="40" height="40" rx="8" fill="url(#pixel)"/>
  <!-- 中下中等方块 -->
  <rect x="58" y="208" width="32" height="32" rx="6" fill="url(#pixel)"/>
  <!-- 最中心小深蓝方块 -->
  <rect x="84" y="162" width="26" height="26" rx="5" fill="#0B2A96" opacity="0.92"/>
  <!-- 中心下中深蓝色方块 -->
  <rect x="50" y="144" width="28" height="28" rx="5" fill="#173DC6" opacity="0.92"/>
</svg>
