<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    MankTV Favicon — 紧凑版本，适配小尺寸显示
  -->
  <defs>
    <linearGradient id="b" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"  stop-color="#00D9FF"/>
      <stop offset="30%" stop-color="#1791FF"/>
      <stop offset="65%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF4FC1"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#1F54E0"/>
    </linearGradient>
  </defs>
  <!-- 播放箭头主体（尖角朝右上，45°） -->
  <path
    d="
      M 31 6
      C 34 6 37 8 40 12
      L 55 38
      C 59 45 57 49 52 51
      L 40 53
      C 37 54 27 54 24 53
      L 12 51
      C 7 49 5 45 9 38
      L 24 12
      C 27 8 29 6 31 6 Z
    "
    fill="url(#b)"
  />
  <!-- 像素方块（压缩到可见 4 个） -->
  <rect x="0" y="17" width="8" height="8" rx="1.6" fill="url(#s)"/>
  <rect x="6" y="27" width="11" height="11" rx="2" fill="url(#s)"/>
  <rect x="0" y="41" width="10" height="10" rx="2" fill="url(#s)"/>
  <rect x="16" y="50" width="8" height="8" rx="1.6" fill="url(#s)"/>
  <rect x="22" y="40" width="6" height="6" rx="1.2" fill="#173DC6" opacity="0.9"/>
</svg>
