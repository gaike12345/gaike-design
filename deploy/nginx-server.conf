# =====================================================
# Man TV · Nginx 站点配置（服务器部署版）
# 域名：gaike.xyz
#
# 部署脚本会自动替换域名和路径，
# 此文件作为模板使用。
# =====================================================

# ============== HTTP → HTTPS 重定向 ==============
server {
    listen 80;
    server_name gaike.xyz www.gaike.xyz;
    return 301 https://$host$request_uri;
}

# ============== HTTPS 主站 ==============
server {
    listen 443 ssl http2;
    server_name gaike.xyz www.gaike.xyz;

    # SSL 证书（certbot 自动管理）
    ssl_certificate /etc/letsencrypt/live/gaike.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaike.xyz/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（确认 HTTPS 稳定后取消注释）
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 根路径
    root /var/www/manktv-frontend;
    index index.html;

    # 上传文件大小限制
    client_max_body_size 50m;
    client_body_buffer_size 128k;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon
        image/jpeg
        image/png
        image/gif
        image/webp;

    # ============== API → 后端 ==============
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # SSE 长连接支持
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        # 超时（AI 生成较慢）
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ============== SSE 流式接口 ==============
    location /api/stream/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ============== 上传文件 ==============
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传文件缓存 1 天
        expires 1d;
        add_header Cache-Control "public";
    }

    # ============== 静态资源缓存 ==============
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 图片等媒体
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|mp4|webm|mp3|wav|ogg)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 字体文件
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============== SPA 路由回退 ==============
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
